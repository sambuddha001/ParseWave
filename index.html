<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong
    // theme. Defaults to dark when the user hasn't chosen yet.
    (function () {
      try {
        var saved = localStorage.getItem("pw:theme");
        var dark =
          saved === "dark" ||
          (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="ParseWave — drop a PDF or text file and listen right away. Narration runs entirely in your browser. No account, no uploads, no length limits."
  />
  <meta name="theme-color" content="#AD4E27" />
  <title>ParseWave</title>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
